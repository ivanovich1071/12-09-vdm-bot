# Развёртывание прототипа на виртуальной машине (Selectel, Cloud.ru — любая Ubuntu).
#
# Виджет и Telegram-бот подняты отдельными сервисами: у них разный режим работы
# (HTTP против long polling), и падение одного не должно ронять другой.
#
#   docker compose up -d --build
#   docker compose run --rm catalog import-1c --file data/raw/pricelist.xlsx   # новая выгрузка на проверку
#   docker compose run --rm catalog import-1c --diff <ID>                      # что изменится
#   docker compose run --rm catalog catalog approve <ID>                       # утвердить и применить
#
# Каталог ведётся версиями (EPIC 4): виджет и Telegram сами подхватывают новую
# версию по указателю data/kb/current, перезапуск не нужен.

# Журнал контейнера растёт без границ и на диске в 20 ГБ это заканчивается
# остановкой всего. Держим три файла по 10 МБ на сервис.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  widget:
    build: .
    command: python run.py widget
    env_file: .env
    ports:
      # Только на localhost: наружу виджет отдаёт nginx по 443, а Docker публикует
      # порты в обход ufw, поэтому «0.0.0.0:8000» открыть и закрыть через ufw нельзя.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    logging: *logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Старт занимает под минуту: разбор каталога (5918 позиций) и проба провайдеров
      # модели. До истечения этого времени неудачная проверка контейнер не роняет.
      start_period: 120s

  telegram:
    build: .
    command: python run.py telegram
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    logging: *logs
    depends_on:
      - widget
    # DNSSelectel отдаёт для api.telegram.org адрес 149.154.166.110, который
    # извне заблокирован (TCP-соединение виснет). Соседняя edge 149.154.167.220
    # доступна, поэтому закрепляем её, пока резолвер не начнёт отвечать рабочими IP.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

  # Разовые команды каталога: импорт 1С, diff, утверждение, версии, откат, фото, реестр.
  # Прямая пересборка `ingest` каталог бота при версиях не меняет.
  catalog:
    build: .
    entrypoint: ["python", "run.py"]
    command: ["catalog", "versions"]
    env_file: .env
    volumes:
      - ./data:/app/data
    profiles: ["tools"]
